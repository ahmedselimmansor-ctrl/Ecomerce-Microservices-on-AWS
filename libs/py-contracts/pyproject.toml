[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "souq-contracts"
version = "1.0.0"
description = "Pydantic models for the SOUQ platform contract. The Python counterpart of libs/ts-contracts."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["souq_contracts*"]

# PEP 561. Without this marker file, mypy refuses to read the package's
# annotations and reports "Cannot find implementation or library stub" in every
# consumer — even though the package is installed and fully typed.
[tool.setuptools.package-data]
souq_contracts = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
