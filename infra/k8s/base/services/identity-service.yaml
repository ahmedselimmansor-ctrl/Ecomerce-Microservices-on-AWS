apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: souq
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: souq
  annotations:
    # Every other service verifies JWTs against this one's JWKS, so it is on the
    # critical path for every authenticated request in the platform.
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never dip below the declared count during a deploy. Surging is cheaper
      # than losing capacity mid-rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: souq
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: identity-service      # IRSA — no static AWS credentials
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # Spread across AZs so losing one does not lose the service.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: identity-service
      containers:
        - name: identity-service
          image: ACCOUNT.dkr.ecr.eu-west-1.amazonaws.com/souq/identity-service:GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081, protocol: TCP }
          env:
            - name: SOUQ_ENV
              value: production
            - name: SOUQ_HTTP_ADDR
              value: ":8081"
            - name: SOUQ_KAFKA_BROKERS
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: kafka.brokers }
            - name: SOUQ_JWKS_URL
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: jwks.url }
            # Signing source. With SOUQ_ENV=production the provider REFUSES to
            # generate an in-memory key — every pod would sign with a different
            # one, so roughly (n-1)/n of all verifications across the platform
            # would fail, which presents as an intermittent auth bug rather
            # than as an outage. That refusal is deliberate.
            #
            # The key ARN comes from the Terraform output jwt_signing_key_arn.
            # Rotation is a timed procedure, not a flag — AWS cannot rotate an
            # asymmetric key in place. See docs/runbooks/jwt-key-rotation.md.
            - name: SOUQ_JWT_KEY_SOURCE
              value: kms
            - name: SOUQ_JWT_KMS_KEY_ID
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: jwt.kms.key.id }
            - name: SOUQ_JWT_ISSUER
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: jwt.issuer }
            - name: SOUQ_JWT_AUDIENCE
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: jwt.audience }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: otel.endpoint }
            - name: OTEL_SERVICE_NAME
              value: identity-service
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef: { name: identity-service-db, key: url }
            - name: JAVA_TOOL_OPTIONS
              # Container-aware heap. Without MaxRAMPercentage the JVM sizes
              # itself against the node and gets OOM-killed on a small limit.
              value: "-XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            # No CPU limit: throttling a latency-sensitive service at the p99
            # does more harm than the noisy-neighbour risk it prevents. Memory
            # IS limited, because a leak must be contained.
            limits: { memory: 1536Mi }
          startupProbe:
            # Covers slow first-boot work without making liveness lenient forever.
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            # Never touches a dependency. A probe a database blip can fail
            # restarts every pod at once and turns a brownout into an outage.
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # Let the ALB deregister this target before the process stops
              # accepting. Without it every deploy drops in-flight requests.
              exec: { command: ["/bin/sleep", "5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: souq
  labels:
    app.kubernetes.io/name: identity-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - { name: http, port: 8081, targetPort: http, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity-service
  namespace: souq
spec:
  # minAvailable, not maxUnavailable: it keeps its meaning when the HPA scales
  # the deployment underneath it.
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity-service
  namespace: souq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity-service
  minReplicas: 3
  maxReplicas: 24
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
    scaleDown:
      # Slow. Scaling in during a lull right before the next burst is how you
      # get a cold-start stampede.
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 25, periodSeconds: 60 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-service
  namespace: souq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: api-gateway }
        - podSelector:
            matchLabels: { app.kubernetes.io/part-of: souq }
      ports:
        - { protocol: TCP, port: 8081 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports:
        - { protocol: TCP, port: 8081 }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Explicitly enumerated, so a compromised pod cannot exfiltrate to an
    # arbitrary endpoint.
    - to:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/part-of: souq }
