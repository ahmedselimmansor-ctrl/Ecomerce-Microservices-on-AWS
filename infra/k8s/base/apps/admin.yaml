apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: souq
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: souq
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: souq
      annotations:
        # Next.js exposes no Prometheus endpoint of its own. The signal that
        # matters for this tier is ALB target health and CloudFront's own
        # metrics, so there is nothing here to scrape and saying so is better
        # than pointing the scraper at a 404 every fifteen seconds.
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: admin
      # Longer than a backend service. Next holds streamed responses open for
      # Suspense boundaries, and cutting one mid-stream leaves the browser with
      # half a page and no error.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: admin
      containers:
        - name: admin
          image: ACCOUNT.dkr.ecr.eu-west-1.amazonaws.com/souq/admin:GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3001, protocol: TCP }
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            # Service URLs, server-side only. None of these is a NEXT_PUBLIC_
            # variable, and that is the whole boundary: a NEXT_PUBLIC_ prefix
            # inlines the value into the client bundle, which would tell the
            # browser how to reach a service directly and defeat the BFF
            # (docs/CONTRACTS.md §8).
            - name: SOUQ_IDENTITY_URL
              value: http://identity-service:8081
            - name: SOUQ_CATALOG_URL
              value: http://catalog-service:8082
            - name: SOUQ_ORDER_URL
              value: http://order-service:8084
            - name: SOUQ_INVENTORY_URL
              value: http://inventory-service:8085
            # The only client of payment-service outside the saga. Reading the
            # ledger is a support function; nothing here writes to it.
            - name: SOUQ_PAYMENT_URL
              value: http://payment-service:8086
            - name: SOUQ_SEARCH_URL
              value: http://search-service:8087
            - name: SOUQ_REVIEW_URL
              value: http://review-service:8090
            # Where to send an operator who needs to sign in or enrol MFA.
            - name: NEXT_PUBLIC_STOREFRONT_URL
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: site.url }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: otel.endpoint }
            - name: OTEL_SERVICE_NAME
              value: admin
            # Node sizes its heap against the node, not the cgroup, and gets
            # OOM-killed on a small limit without being told otherwise.
            - name: NODE_OPTIONS
              value: "--enable-source-maps --max-old-space-size=768"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          startupProbe:
            # Next's first request compiles and warms the route tree. Sixty
            # seconds of grace here is what keeps the liveness probe strict
            # forever after.
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # A different path from liveness, deliberately. Readiness may check
            # that the services this app fans out to are reachable; liveness
            # must never, or a database blip restarts every pod at once and
            # turns a brownout into an outage.
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: { command: ["/bin/sleep", "5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Next writes its ISR cache here. With a read-only root filesystem
            # and no volume, every revalidating page throws EROFS — and Next
            # swallows it, so the symptom is "revalidation silently never
            # happens" rather than an error.
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: next-cache
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
  namespace: souq
  # No IRSA annotation, for the same reason as the storefront: everything goes
  # through the backends, so there is no AWS identity to grant. An unused role
  # is a role someone eventually attaches a policy to.
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: souq
  labels:
    app.kubernetes.io/name: admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin
  ports:
    - { name: http, port: 3001, targetPort: http, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admin
  namespace: souq
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin
  namespace: souq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: admin
  minReplicas: 2
  # Small. The audience is the operations team, not the internet, and an admin
  # tool that autoscales to forty pods is one whose traffic is coming from
  # somewhere it should not be.
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 25, periodSeconds: 60 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin
  namespace: souq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: admin
  policyTypes: [Ingress, Egress]
  ingress:
    # From the ingress controller only, and the ALB in front of it should be
    # restricted further still — an operations tool reachable from the open
    # internet is one whose only defence is the login page.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress }
      ports:
        - { protocol: TCP, port: 3001 }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # A different list from the storefront's, and the difference is the point.
    # This tier may read payment and inventory — support genuinely needs the
    # ledger and stock levels — but has no reason to reach cart or the
    # recommender, so it cannot.
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/part-of: souq }
      ports:
        - { protocol: TCP, port: 8081 }   # identity
        - { protocol: TCP, port: 8082 }   # catalog
        - { protocol: TCP, port: 8084 }   # order
        - { protocol: TCP, port: 8085 }   # inventory
        - { protocol: TCP, port: 8086 }   # payment
        - { protocol: TCP, port: 8087 }   # search
        - { protocol: TCP, port: 8090 }   # review
    - to:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 4317 }   # OTLP
