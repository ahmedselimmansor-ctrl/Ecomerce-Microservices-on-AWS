apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: souq
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: souq
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: souq
      annotations:
        # Next.js exposes no Prometheus endpoint of its own. The signal that
        # matters for this tier is ALB target health and CloudFront's own
        # metrics, so there is nothing here to scrape and saying so is better
        # than pointing the scraper at a 404 every fifteen seconds.
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: storefront
      # Longer than a backend service. Next holds streamed responses open for
      # Suspense boundaries, and cutting one mid-stream leaves the browser with
      # half a page and no error.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: storefront
      containers:
        - name: storefront
          image: ACCOUNT.dkr.ecr.eu-west-1.amazonaws.com/souq/storefront:GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000, protocol: TCP }
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            # Service URLs, server-side only. None of these is a NEXT_PUBLIC_
            # variable, and that is the whole boundary: a NEXT_PUBLIC_ prefix
            # inlines the value into the client bundle, which would tell the
            # browser how to reach a service directly and defeat the BFF
            # (docs/CONTRACTS.md §8).
            - name: SOUQ_IDENTITY_URL
              value: http://identity-service:8081
            - name: SOUQ_CATALOG_URL
              value: http://catalog-service:8082
            - name: SOUQ_CART_URL
              value: http://cart-service:8083
            - name: SOUQ_ORDER_URL
              value: http://order-service:8084
            - name: SOUQ_SEARCH_URL
              value: http://search-service:8087
            - name: SOUQ_RECOMMENDATION_URL
              value: http://recommendation-service:8088
            - name: SOUQ_REVIEW_URL
              value: http://review-service:8090
            # Public, and safe to be: the canonical origin, used for
            # metadataBase and Open Graph URLs.
            - name: NEXT_PUBLIC_SITE_URL
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: site.url }
            - name: NEXT_PUBLIC_ADMIN_URL
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: admin.url }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: souq-platform, key: otel.endpoint }
            - name: OTEL_SERVICE_NAME
              value: storefront
            # Node sizes its heap against the node, not the cgroup, and gets
            # OOM-killed on a small limit without being told otherwise.
            - name: NODE_OPTIONS
              value: "--enable-source-maps --max-old-space-size=768"
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          startupProbe:
            # Next's first request compiles and warms the route tree. Sixty
            # seconds of grace here is what keeps the liveness probe strict
            # forever after.
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # A different path from liveness, deliberately. Readiness may check
            # that the services this app fans out to are reachable; liveness
            # must never, or a database blip restarts every pod at once and
            # turns a brownout into an outage.
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: { command: ["/bin/sleep", "5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Next writes its ISR cache here. With a read-only root filesystem
            # and no volume, every revalidating page throws EROFS — and Next
            # swallows it, so the symptom is "revalidation silently never
            # happens" rather than an error.
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: next-cache
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storefront
  namespace: souq
  # No IRSA annotation. The storefront talks to no AWS service directly —
  # everything goes through the eleven backends — so it gets no AWS identity at
  # all. An unused role is a role someone eventually attaches a policy to.
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: souq
  labels:
    app.kubernetes.io/name: storefront
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - { name: http, port: 3000, targetPort: http, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storefront
  namespace: souq
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storefront
  namespace: souq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storefront
  minReplicas: 3
  # Higher than a backend service: this tier absorbs the full uncached request
  # rate, and a CloudFront cache purge sends all of it to origin at once.
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 25, periodSeconds: 60 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storefront
  namespace: souq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: storefront
  policyTypes: [Ingress, Egress]
  ingress:
    # From the ingress controller only. Nothing inside the mesh has any reason
    # to call the storefront, and allowing it would make this pod a usable
    # pivot for reaching the backends from a compromised service.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress }
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # The seven services the BFF fans out to, and the collector. Enumerated
    # rather than "anything in the namespace", so a compromised render process
    # cannot reach payment-service — which it has no business calling and which
    # holds the ledger.
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/part-of: souq }
      ports:
        - { protocol: TCP, port: 8081 }   # identity
        - { protocol: TCP, port: 8082 }   # catalog
        - { protocol: TCP, port: 8083 }   # cart
        - { protocol: TCP, port: 8084 }   # order
        - { protocol: TCP, port: 8087 }   # search
        - { protocol: TCP, port: 8088 }   # recommendation
        - { protocol: TCP, port: 8090 }   # review
    - to:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 4317 }   # OTLP
