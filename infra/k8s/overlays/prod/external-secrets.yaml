# Secrets arrive from AWS Secrets Manager via External Secrets Operator.
#
# The connection string never exists in git, never in a ConfigMap, and rotates
# without a deploy — ESO re-reads on `refreshInterval` and updates the Secret,
# and the pods' connection pools reconnect on their next cycle.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: souq
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          # IRSA. No static AWS credentials anywhere in the cluster.
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: order-service-db
  namespace: souq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: order-service-db
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: souq-prod/db/orders
        property: url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-service-secrets
  namespace: souq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: payment-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-url
      remoteRef: { key: souq-prod/db/payments, property: url }
    # The salt for the deterministic provider key. Changing it changes a value
    # Paymob has already seen for every in-flight payment, so it must be
    # rotated with a migration plan, never casually.
    - secretKey: psp-key-salt
      remoteRef: { key: souq-prod/payment/psp-key-salt }
    - secretKey: paymob-api-key
      remoteRef: { key: souq-prod/payment/paymob-api-key }
    # Without this the webhook is unauthenticated and anyone can mark an order
    # as paid. payment-service refuses to start if it is absent.
    - secretKey: paymob-hmac-secret
      remoteRef: { key: souq-prod/payment/paymob-hmac-secret }
