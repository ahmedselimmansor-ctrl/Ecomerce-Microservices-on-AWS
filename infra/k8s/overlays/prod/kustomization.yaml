apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - external-secrets.yaml

configMapGenerator:
  - name: souq-platform
    behavior: merge
    literals:
      - environment=production

# Pinned to a git SHA by CI, never to a tag. A mutable tag means two pods in
# the same ReplicaSet can be running different code, which produces bugs that
# are impossible to reproduce.
images:
  - name: ACCOUNT.dkr.ecr.eu-west-1.amazonaws.com/souq/order-service
    newName: ACCOUNT.dkr.ecr.eu-west-1.amazonaws.com/souq/order-service
    newTag: GIT_SHA_PLACEHOLDER

replicas:
  - name: order-service
    count: 3
