apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s
      # Lets a panel link straight through to the trace for a slow request.
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: jaeger
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
