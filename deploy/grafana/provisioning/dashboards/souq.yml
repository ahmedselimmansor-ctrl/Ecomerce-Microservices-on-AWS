apiVersion: 1
providers:
  - name: souq
    orgId: 1
    folder: SOUQ
    type: file
    disableDeletion: false
    # Dashboards are files in git, not clicked together in the UI. A dashboard
    # nobody can review in a diff is a dashboard that silently rots.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
