# Alerting rules, mirrored from infra/terraform/modules/observability/main.tf.
#
# Generated by scripts/sync-alerts.sh — do not edit by hand. Terraform is the
# source of truth; this copy exists so the same alerts can be seen firing
# locally. An alert that only exists in production is one nobody has watched.
groups:
- name: souq.invariants
  interval: 30s
  rules:
  - alert: IllegalSagaTransition
    expr: increase(souq_saga_illegal_transitions_total[5m]) > 0
    for: 0m
    labels:
      severity: page
      runbook: docs/runbooks/illegal-saga-transition.md
    annotations:
      summary: The saga took a transition internal/saga/model_test.go says is impossible
      description: '{{ $value }} illegal transition(s) from {{ $labels.from }} on {{ $labels.trigger }}.
        The implementation has diverged from the proven design. Do not restart anything until the affected
        orders have been identified.'
  - alert: OversellDetected
    expr: souq_inventory_reserved > souq_inventory_on_hand
    for: 0m
    labels:
      severity: page
      runbook: docs/runbooks/oversell.md
    annotations:
      summary: SKU {{ $labels.sku }} has more reserved than exists
      description: The no_oversell CHECK constraint should make this unrepresentable. If it is firing,
        either the constraint was dropped or something is writing outside the application.
  - alert: LedgerImbalance
    expr: souq_ledger_unbalanced_groups > 0
    for: 2m
    labels:
      severity: page
      runbook: docs/runbooks/ledger-imbalance.md
    annotations:
      summary: '{{ $value }} unbalanced double-entry group(s)'
      description: The books do not balance. Finance reconciliation will fail.
  - alert: SagaStuckPastPointOfNoReturn
    expr: souq_saga_stuck_orders > 0
    for: 5m
    labels:
      severity: page
      runbook: docs/runbooks/stuck-saga.md
    annotations:
      summary: '{{ $value }} order(s) wedged past the point of no return'
      description: "Stock is committed and payment has not settled. These cannot be rolled back (docs/DESIGN-INVARIANTS.md\
        \ \xA71) and need manual resolution."
  - alert: UnknownPaymentOutcome
    expr: increase(souq_payment_unknown_outcome_total[10m]) > 0
    for: 0m
    labels:
      severity: page
      runbook: docs/runbooks/unknown-payment-outcome.md
    annotations:
      summary: A payment's outcome is unknown and needs reconciliation
      description: We asked the provider and did not learn the answer. The customer may or may not have
        been charged. Reconcile against Paymob before doing anything else.
- name: souq.slo
  interval: 30s
  rules:
  - alert: CheckoutErrorBudgetBurningFast
    expr: "(\n  sum(rate(http_server_requests_total{route=\"/v1/orders\",status=\"5xx\"}[1h]))\n  / sum(rate(http_server_requests_total{route=\"\
      /v1/orders\"}[1h]))\n) > (14.4 * 0.0005)\n"
    for: 2m
    labels:
      severity: page
      runbook: docs/runbooks/checkout-errors.md
    annotations:
      summary: Checkout is burning its error budget 14x too fast
  - alert: CheckoutErrorBudgetBurningSlowly
    expr: "(\n  sum(rate(http_server_requests_total{route=\"/v1/orders\",status=\"5xx\"}[6h]))\n  / sum(rate(http_server_requests_total{route=\"\
      /v1/orders\"}[6h]))\n) > (6 * 0.0005)\n"
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: Checkout error budget burning at 6x
  - alert: CheckoutLatencyBudgetBreached
    expr: "histogram_quantile(0.99,\n  sum(rate(http_server_requests_seconds_bucket{route=\"/v1/orders\"\
      }[5m])) by (le)\n) > 0.8\n"
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: Checkout p99 is {{ $value | humanizeDuration }}, SLO is 800ms
- name: souq.degradation
  interval: 1m
  rules:
  - alert: OutboxBacklogGrowing
    expr: deriv(souq_outbox_unpublished[10m]) > 1
    for: 10m
    labels:
      severity: ticket
      runbook: docs/runbooks/outbox-backlog.md
    annotations:
      summary: The outbox relay is losing to the write rate on {{ $labels.service }}
      description: Events are getting stale even though each publish succeeds.
  - alert: DeadLetterQueueGrowing
    expr: increase(souq_events_consumed_total{outcome="dlq"}[15m]) > 5
    for: 5m
    labels:
      severity: ticket
      runbook: docs/runbooks/dlq.md
    annotations:
      summary: '{{ $value }} messages sent to the DLQ from {{ $labels.topic }}'
  - alert: PricingEngineCircuitOpen
    expr: souq_pricing_calls_total{outcome="circuit_open"} > 0
    for: 5m
    labels:
      severity: ticket
    annotations:
      summary: Carts are being priced at list price
      description: "pricing-engine is unreachable and the breaker is open. Customers are not seeing their\
        \ promotions. Not an outage \u2014 checkout still works \u2014 but it is a revenue and trust problem."
  - alert: RecommendationsAllFallback
    expr: 'sum(rate(souq_recommendations_total{fallback="true"}[10m]))

      / sum(rate(souq_recommendations_total[10m])) > 0.5

      '
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: Over half of recommendations are the fallback ranker
  - alert: ReservationTTLSweeperActive
    expr: increase(souq_reservation_ttl_expiries_total[15m]) > 10
    for: 5m
    labels:
      severity: ticket
    annotations:
      summary: The TTL sweeper is releasing reservations the saga should have
  - alert: RefreshTokenReuseSpike
    expr: increase(souq_refresh_token_reuse_total[15m]) > 20
    for: 5m
    labels:
      severity: ticket
      runbook: docs/runbooks/token-reuse.md
    annotations:
      summary: '{{ $value }} refresh-token reuses detected'
      description: Occasional reuse is a client retrying after a network failure. A spike is credential
        theft or a broken client release.
