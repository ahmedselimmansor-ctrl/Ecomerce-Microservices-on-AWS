[mypy]
python_version = 3.12

# The pydantic plugin. Without it mypy builds each model's __init__ signature
# from the ALIASES and rejects `Suggestion(product_id=...)` — even though
# populate_by_name makes it valid at runtime. The plugin reads the model config
# and accepts both, which is what the code actually does.
plugins = pydantic.mypy

# Point mypy at the shared contracts SOURCE, not at whatever pip did with it.
#
# requirements.txt installs it with `-e`, and an editable install goes through
# a generated __editable__ finder that mypy does not follow — so it reported
# "Cannot find implementation or library stub for module named souq_contracts"
# even though the package imported fine at runtime. A path is deterministic and
# does not care how the package was installed.
mypy_path = ../../libs/py-contracts
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
# Our own code is checked properly. The per-module overrides below are only for
# third-party libraries, and each is listed by name rather than being waved
# through with a blanket ignore_missing_imports — a global switch would also
# silence a genuinely missing first-party import, which is the failure this
# service already had.
disallow_untyped_defs = False
no_implicit_optional = True

# These ship no type information: no inline annotations, no stub package, no
# py.typed marker. Nothing to check against, so mypy is told not to try.
[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-aiokafka.*]
ignore_missing_imports = True

[mypy-elasticsearch.*]
ignore_missing_imports = True

[mypy-opensearchpy.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-pythonjsonlogger.*]
ignore_missing_imports = True

[pydantic-mypy]
# Build __init__ signatures from the real field types, and reject a keyword
# the model does not define. Both make the plugin's checking stricter than the
# default, which is the point of enabling it.
init_typed = True
init_forbid_extra = True
warn_required_dynamic_aliases = True
