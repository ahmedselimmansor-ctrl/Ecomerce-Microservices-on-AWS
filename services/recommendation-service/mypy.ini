[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
# Our own code is checked properly. The per-module overrides below are only for
# third-party libraries, and each is listed by name rather than being waved
# through with a blanket ignore_missing_imports — a global switch would also
# silence a genuinely missing first-party import, which is the failure this
# service already had.
disallow_untyped_defs = False
no_implicit_optional = True

# These ship no type information: no inline annotations, no stub package, no
# py.typed marker. Nothing to check against, so mypy is told not to try.
[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-aiokafka.*]
ignore_missing_imports = True

[mypy-elasticsearch.*]
ignore_missing_imports = True

[mypy-opensearchpy.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-pythonjsonlogger.*]
ignore_missing_imports = True
