spring:
  application.name: catalog-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Larger than identity's pool: this service serves the browsing path, so
      # its read volume is an order of magnitude higher. Still sized against the
      # Aurora connection budget rather than against peak traffic.
      maximum-pool-size: 30
      minimum-idle: 4
      connection-timeout: 2000
      max-lifetime: 1800000
      keepalive-time: 300000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${SOUQ_KAFKA_BROKERS}
    producer:
      acks: all
      properties.enable.idempotence: true
      retries: 3
      compression-type: snappy

server:
  port: ${SOUQ_HTTP_PORT:8082}
  shutdown: graceful
  tomcat.connection-timeout: 5s
  error.whitelabel.enabled: false
  # Product pages carry long descriptions and image arrays; compression pays
  # for itself well before the CDN sees the response.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB

management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health:
    probes.enabled: true
    group:
      liveness.include: livenessState
      readiness.include: readinessState,db
    show-details: never
  metrics.tags.service: catalog-service

souq:
  jwt:
    issuer: ${SOUQ_JWT_ISSUER:https://auth.souq.dev}
    audience: ${SOUQ_JWT_AUDIENCE:souq-api}
    # Fetched and cached for 5 minutes, per docs/CONTRACTS.md §7. No auth
    # round-trip per request; the cost is that a rotated key takes up to one
    # cache TTL to become usable.
    jwks-url: ${SOUQ_JWKS_URL:http://identity-service:8081/v1/.well-known/jwks.json}
    jwks-cache-minutes: 5

  catalog:
    # A page bigger than this is almost always a scraper, and it is also the
    # point where the response stops fitting comfortably in one CDN object.
    max-page-size: 100
    default-page-size: 24
    # Product reads are cacheable at the edge; the TTL is short because a price
    # change should reach shoppers in about a minute, not an hour.
    product-cache-seconds: 60
    category-cache-seconds: 300

  outbox:
    poll-interval-ms: 500

logging.level:
  root: INFO
  dev.souq: ${SOUQ_LOG_LEVEL:INFO}
